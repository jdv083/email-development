<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f4f4;">
  <!-- Wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:20px 0;">

        <!-- Container -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff;">
          
          <!-- Header -->
          <tr>
            <td align="center" style="padding:24px 24px 16px 24px; background-color:#ffffff;">
              <img src="https://via.placeholder.com/150x40" width="150" alt="Company Logo" border="0" style="display:block; height:auto;">
            </td>
          </tr>

          <!-- Hero -->
          <tr>
            <td align="center" style="padding:0;">
              <img src="https://via.placeholder.com/600x300" width="600" alt="Hero Image" border="0" style="display:block; width:100%; max-width:600px; height:auto;">
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td align="left" style="padding:24px 24px 16px 24px; font-family:Arial, Helvetica, sans-serif; color:#333333;">
              <h1 style="margin:0 0 12px 0; font-size:24px; line-height:32px; font-weight:bold;">
                Email Headline Goes Here
              </h1>
              <p style="margin:0 0 16px 0; font-size:16px; line-height:24px;">
                Hello {{firstName}},
              </p>
              <p style="margin:0 0 16px 0; font-size:16px; line-height:24px;">
                This is a Lessonly-safe HTML email layout using table-based structure and fully inline CSS for reliable rendering across Gmail and Outlook.
              </p>
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td align="center" style="padding:8px 24px 32px 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#2F80ED" style="border-radius:4px;">
                    <a href="https://example.com" target="_blank"
                      style="display:inline-block; padding:12px 24px; font-family:Arial, Helvetica, sans-serif; font-size:16px; color:#ffffff; text-decoration:none;">
                      Call to Action
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-top:1px solid #e0e0e0;"></td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:24px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px; color:#777777;">
              <p style="margin:0 0 8px 0;">
                Company Name<br>
                123 Business Street, City, State
              </p>
              <p style="margin:0;">
                <a href="https://example.com/unsubscribe" style="color:#777777; text-decoration:underline;">
                  Unsubscribe
                </a>
              </p>
            </td>
          </tr>

        </table>
        <!-- End Container -->

      </td>
    </tr>
  </table>
  <!-- End Wrapper -->
</body>
</html>
