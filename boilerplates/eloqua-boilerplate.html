<!DOCTYPE html>
<html lang="en" dir="ltr"
      xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>HTML Email Template Boilerplate</title>

  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->

  <style type="text/css">
    table {
      border-spacing: 0;
      border-collapse: collapse;
    }
    td {
      padding: 0;
    }
    img {
      border: 0;
      display: block;
      max-width: 100%;
      height: auto;
    }
    p {
      font-size: 16px;
      line-height: 1.4;
    }
    a {
      color: inherit;
      text-decoration: none;
    }

    /* Outlook.com / Hotmail */
    .ExternalClass {
      width: 100%;
    }
    .ExternalClass,
    .ExternalClass p,
    .ExternalClass span,
    .ExternalClass td,
    .ExternalClass div {
      line-height: 100%;
    }

    /* iOS blue link reset */
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
    }

    /* Gmail dark mode blend fix */
    u + .body .gmail-blend-screen {
      background-color: #000000;
      mix-blend-mode: screen;
    }
    u + .body .gmail-blend-difference {
      background-color: #000000;
      mix-blend-mode: difference;
    }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      body, table {
        background-color: #2d2d2d !important;
        color: #ffffff !important;
      }
      [data-ogsc] body,
      [data-ogsc] table {
        background-color: #2d2d2d !important;
        color: #ffffff !important;
      }
    }
  </style>

  <!--[if mso]>
  <style type="text/css">
    body, table, td, p, a {
      font-family: Arial, Helvetica, sans-serif !important;
    }
  </style>
  <![endif]-->
</head>

<body class="body"
      xml:lang="en"
      style="padding:0; width:100%; background-color:#dde0e1;">

  <div style="
    width:100%;
    table-layout:fixed;
    background-color:#dde0e1;
    font-family:Arial, Helvetica, sans-serif;
    font-size:16px;
    color:#3d3d3d;
    padding-bottom:40px;">

    <div style="
      max-width:600px;
      background-color:#fafdfe;
      font-family:Arial, Helvetica, sans-serif;
      font-size:16px;
      color:#3d3d3d;
      padding:0;">

      <!-- PREHEADER (UNICODE PRESERVED — DO NOT EDIT) -->
      <div style="
        font-size:0;
        color:#fafdfe;
        mso-line-height-rule:exactly;
        line-height:0;
        display:none;
        max-width:0;
        max-height:0;
        opacity:0;
        overflow:hidden;
        mso-hide:all;">
        This is our preheader text which can be 35-190 characters but 85-100 is recommended.
        &zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;
      </div>

      <!--[if mso]>
      <table width="600" align="center" role="presentation">
        <tr>
          <td>
      <![endif]-->

      <table align="center"
             width="100%"
             style="max-width:600px; background-color:#fafdfe;"
             role="presentation">

        <!-- HEADINGS -->
        <tr>
          <td style="padding:20px; text-align:center;">
            <h1 style="font-size:30px; padding:0;">This is some text.</h1>
            <h2 style="font-size:26px; padding-top:8px;">This is some text.</h2>
            <h3 style="font-size:22px; padding-top:8px;">This is some text.</h3>
          </td>
        </tr>

        <!-- BACKGROUND TEXT -->
        <tr>
          <td style="padding:16px; background-color:#21c6b8; text-align:center;">
            <h1 style="font-size:30px; color:#000000;">
              Text without CSS Blend Mode.
            </h1>
          </td>
        </tr>

        <!-- GMAIL BLEND MODE DEMO -->
        <tr>
          <td style="
            padding:16px;
            background-color:#21c6b8;
            background:linear-gradient(#21c6b8, #21c6b8);">

            <div class="gmail-blend-screen">
              <div class="gmail-blend-difference">
                <h1 style="font-size:30px; color:#ffffff; text-align:center;">
                  This is CSS Blend Mode text.
                </h1>
              </div>
            </div>

          </td>
        </tr>

      </table>

      <!--[if mso]>
          </td>
        </tr>
      </table>
      <![endif]-->

    </div>
  </div>

</body>
</html>
