<!--
SECTION: divider

PURPOSE:
- Visually separate sections
- Prevent misuse of <hr> or spacing hacks

USE WHEN:
- Long emails
- Multiple content blocks

TOKENS USED:
- DIVIDER_COLOR
-->

<tr>
  <td style="padding:20px 0;">
    <table width="100%" role="presentation">
      <tr>
        <td height="1" bgcolor="#{{DIVIDER_COLOR}}" style="font-size:0;line-height:0;">
          &nbsp;
        </td>
      </tr>
    </table>
  </td>
</tr>
