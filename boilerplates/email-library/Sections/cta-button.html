<!--
SECTION_BG: #f3e1dc
HEADER_BG:  #f3e1dc
CARD_BG:    #346565
TEXT_COLOR: #ffffff
ACCENT:     #546c94
PADDING:    20px
-->
<!-- SECTION: CTA (VML REQUIRED) -->
<tr>
  <td align="center" bgcolor="#{{SECTION_BG}}" style="padding:30px;">

    <!--[if mso]>
    <v:roundrect
      href="{{URL}}"
      arcsize="10%"
      fillcolor="#{{ACCENT}}"
      stroke="f"
      style="height:44px;v-text-anchor:middle;width:220px;">
      <w:anchorlock/>
      <center style="color:#ffffff;font-family:Arial,Helvetica,sans-serif;
                     font-size:16px;font-weight:bold;">
        {{CTA_TEXT}}
      </center>
    </v:roundrect>
    <![endif]-->

    <!--[if !mso]>-->
    <a href="{{URL}}"
       style="background-color:#{{ACCENT}};
              color:#ffffff;
              font-size:16px;
              font-weight:bold;
              text-decoration:none;
              padding:12px 24px;
              border-radius:6px;
              display:inline-block;">
      {{CTA_TEXT}}
    </a>
    <!--<![endif]-->

  </td>
</tr>
<!-- END SECTION -->
<!--
SECTION: image-text-editorial

PURPOSE:
- Editorial or product callout
- Image + supporting copy + CTA
- Strong scan hierarchy

USE WHEN:
- Highlighting a feature or product
- Marketing or announcement emails

DO NOT USE WHEN:
- Content is purely transactional
- You need symmetrical columns

TOKENS USED:
- SECTION_BG
- CARD_BG
- TEXT_COLOR
- ACCENT_COLOR
- IMG_SRC
- IMG_ALT
- CTA_TEXT
- CTA_URL

CSS REFERENCE (DOCUMENTATION ONLY)
---------------------------------
.section {
  background-color: SECTION_BG;
}

.image-column {
  width: 260px;
}

.text-column {
  width: 340px;
}

.card {
  padding: 20px;
}

Never rely on these classes for rendering.
-->

<tr>
  <td bgcolor="#{{SECTION_BG}}" style="padding:0;">

    <table width="100%" role="presentation">

      <tr>
        <td style="font-size:0;text-align:center;">

          <!-- IMAGE COLUMN -->
          <!--[if mso]>
          <table width="100%" role="presentation"><tr>
          <td width="260" valign="top">
          <![endif]-->

          <table width="100%" style="max-width:260px;display:inline-block;" role="presentation">
            <tr>
              <td style="padding:20px;">
                <img src="{{IMG_SRC}}"
                     width="220"
                     alt="{{IMG_ALT}}"
                     style="display:block;border:0;">
              </td>
            </tr>
          </table>

          <!--[if mso]></td><td width="340" valign="top"><![endif]-->

          <!-- TEXT COLUMN -->
          <table width="100%" style="max-width:340px;display:inline-block;" role="presentation">
            <tr>
              <td bgcolor="#{{CARD_BG}}" style="padding:20px;color:#{{TEXT_COLOR}};">

                <p style="margin:0 0 12px;font-size:18px;font-weight:bold;">
                  {{HEADLINE}}
                </p>

                <p style="margin:0 0 16px;">
                  {{BODY_COPY}}
                </p>

                <!-- CTA -->
                <!--[if mso]>
                <v:roundrect
                  href="{{CTA_URL}}"
                  arcsize="10%"
                  fillcolor="#{{ACCENT_COLOR}}"
                  stroke="f"
                  style="height:40px;v-text-anchor:middle;width:180px;">
                  <w:anchorlock/>
                  <center style="
                    color:#ffffff;
                    font-family:Arial,Helvetica,sans-serif;
                    font-size:14px;
                    font-weight:bold;">
                    {{CTA_TEXT}}
                  </center>
                </v:roundrect>
                <![endif]-->

                <!--[if !mso]>-->
                <a href="{{CTA_URL}}"
                   style="
                     background-color:#{{ACCENT_COLOR}};
                     color:#ffffff;
                     font-size:14px;
                     font-weight:bold;
                     text-decoration:none;
                     padding:10px 18px;
                     border-radius:6px;
                     display:inline-block;">
                  {{CTA_TEXT}}
                </a>
                <!--<![endif]-->

              </td>
            </tr>
          </table>

          <!--[if mso]></td></tr></table><![endif]-->

        </td>
      </tr>

    </table>

  </td>
</tr>
