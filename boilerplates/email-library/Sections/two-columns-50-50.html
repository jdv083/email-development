<!--
SECTION_BG: #f3e1dc
HEADER_BG:  #f3e1dc
CARD_BG:    #346565
TEXT_COLOR: #ffffff
ACCENT:     #546c94
PADDING:    20px
-->
<!-- SECTION: Two Column 50/50 -->
<tr>
  <td style="background-color:#{{SECTION_BG}};padding:0;">
    <table width="100%" role="presentation">

      <tr>
        <td style="padding:12px;background-color:#{{HEADER_BG}};">
          <p style="margin:0;text-align:center;font-size:22px;">
            {{SECTION_TITLE}}
          </p>
        </td>
      </tr>

      <tr>
        <td style="font-size:0;text-align:center;">

          <!--[if mso]>
          <table width="100%" role="presentation"><tr>
          <td width="300" valign="top">
          <![endif]-->

          <table width="100%" style="max-width:300px;display:inline-block;" role="presentation">
            <tr>
              <td style="padding:{{PADDING}};background-color:#{{CARD_BG}};color:#{{TEXT_COLOR}};">
                <img src="{{IMG_1}}" width="260" alt="" style="display:block;margin:0 auto;">
                <p style="margin:10px 0 0;">{{COPY_1}}</p>
              </td>
            </tr>
          </table>

          <!--[if mso]></td><td width="300" valign="top"><![endif]-->

          <table width="100%" style="max-width:300px;display:inline-block;" role="presentation">
            <tr>
              <td style="padding:{{PADDING}};background-color:#{{CARD_BG}};color:#{{TEXT_COLOR}};">
                <img src="{{IMG_2}}" width="260" alt="" style="display:block;margin:0 auto;">
                <p style="margin:10px 0 0;">{{COPY_2}}</p>
              </td>
            </tr>
          </table>

          <!--[if mso]></td></tr></table><![endif]-->

        </td>
      </tr>

    </table>
  </td>
</tr>
<!-- END SECTION -->
