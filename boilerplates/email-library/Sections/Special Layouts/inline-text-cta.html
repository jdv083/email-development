<!--
SECTION: inline-text-cta

PURPOSE:
- Text-first messaging with a clear CTA
- Transactional or reminder-style content

USE WHEN:
- No image needed
- Message clarity > visual impact

DO NOT USE WHEN:
- Campaign requires strong visual branding

TOKENS USED:
- SECTION_BG
- TEXT_COLOR
- ACCENT_COLOR
- HEADLINE
- BODY_COPY
- CTA_TEXT
- CTA_URL
-->

<tr>
  <td bgcolor="#{{SECTION_BG}}" style="padding:30px;color:#{{TEXT_COLOR}};">

    <p style="margin:0 0 12px;font-size:20px;font-weight:bold;">
      {{HEADLINE}}
    </p>

    <p style="margin:0 0 20px;">
      {{BODY_COPY}}
    </p>

    <!-- CTA -->
    <!--[if mso]>
    <v:roundrect
      href="{{CTA_URL}}"
      arcsize="10%"
      fillcolor="#{{ACCENT_COLOR}}"
      stroke="f"
      style="height:40px;v-text-anchor:middle;width:200px;">
      <w:anchorlock/>
      <center style="color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold;">
        {{CTA_TEXT}}
      </center>
    </v:roundrect>
    <![endif]-->

    <!--[if !mso]>-->
    <a href="{{CTA_URL}}"
       style="background-color:#{{ACCENT_COLOR}};
              color:#ffffff;
              font-size:14px;
              font-weight:bold;
              text-decoration:none;
              padding:10px 18px;
              border-radius:6px;
              display:inline-block;">
      {{CTA_TEXT}}
    </a>
    <!--<![endif]-->

  </td>
</tr>
