<!--
SECTION: full-bleed-callout

PURPOSE:
- Emphasized messaging
- Promotions, alerts, legal notices

USE WHEN:
- Content must stand out
- Image is unnecessary

DO NOT USE WHEN:
- Subtle separation is sufficient

TOKENS USED:
- BAND_BG
- TEXT_COLOR
- HEADLINE
- BODY_COPY
-->

<tr>
  <td bgcolor="#{{BAND_BG}}" style="padding:30px 0;">

    <table width="600" align="center" role="presentation">
      <tr>
        <td style="padding:0 30px;color:#{{TEXT_COLOR}};">

          <p style="margin:0 0 8px;font-size:18px;font-weight:bold;">
            {{HEADLINE}}
          </p>

          <p style="margin:0;">
            {{BODY_COPY}}
          </p>

        </td>
      </tr>
    </table>

  </td>
</tr>
