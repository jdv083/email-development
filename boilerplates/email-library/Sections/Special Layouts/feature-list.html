<!--
SECTION: feature-list

PURPOSE:
- Communicate multiple benefits clearly
- Icon + heading + description pattern

USE WHEN:
- SaaS updates
- Feature announcements
- Benefits lists

DO NOT USE WHEN:
- Content requires comparison tables

TOKENS USED:
- SECTION_BG
- TEXT_COLOR
- ICON_SRC
- FEATURE_TITLE
- FEATURE_COPY
-->

<tr>
  <td bgcolor="#{{SECTION_BG}}" style="padding:30px;color:#{{TEXT_COLOR}};">

    <!-- REPEAT FEATURE BLOCK -->
    <table width="100%" role="presentation">
      <tr>
        <td width="40" valign="top">
          <img src="{{ICON_SRC}}" width="24" alt="" style="display:block;">
        </td>
        <td valign="top" style="padding-left:12px;">
          <p style="margin:0 0 4px;font-weight:bold;">
            {{FEATURE_TITLE}}
          </p>
          <p style="margin:0;">
            {{FEATURE_COPY}}
          </p>
        </td>
      </tr>
    </table>

  </td>
</tr>
