<!--
SECTION: BACKGROUND IMAGE WITH OVERLAY (VML REQUIRED)

USE WHEN:
- Text overlays a background image
- Outlook Windows support required

REQUIRES:
- Explicit height
- Fallback background color
-->

<tr>
  <td
    background="{{BG_IMG_SRC}}"
    width="600"
    height="{{BG_HEIGHT}}"
    style="
      background:url('{{BG_IMG_SRC}}') center / cover no-repeat #{{FALLBACK_BG}};
      width:600px;
      height:{{BG_HEIGHT}}px;">

    <!--[if mso]>
    <v:image
      src="{{BG_IMG_SRC}}"
      style="width:450pt;height:{{BG_HEIGHT_PT}}pt;"
      fill="true" />
    <v:rect
      fill="true"
      stroke="false"
      style="width:450pt;height:{{BG_HEIGHT_PT}}pt;">
      <v:fill opacity="0%" />
      <v:textbox inset="0,0,0,0">
    <![endif]-->

    <!-- CONTENT -->
    <table width="100%" height="{{BG_HEIGHT}}" role="presentation">
      <tr>
        <td align="center" valign="middle">
          {{OVERLAY_CONTENT}}
        </td>
      </tr>
    </table>

    <!--[if mso]>
      </v:textbox>
    </v:rect>
    <![endif]-->

  </td>
</tr>
