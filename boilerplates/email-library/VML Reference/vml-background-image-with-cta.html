<!--
SECTION: BACKGROUND IMAGE WITH CTA OVERLAY (VML REQUIRED)

USE WHEN:
- Hero/banner section
- CTA must sit on top of background image
- Outlook Windows support required

REQUIRES:
- Explicit height
- VML height in pt
- CTA must use blessed VML button pattern



****Notes (lock these mentally)****

CTA is inside the VML container → correct layering

No opacity tricks (Outlook breaks them)

Button survives:

Outlook Windows

Gmail apps

Apple Mail

Background image degrades cleanly to FALLBACK_BG
-->

<tr>
  <td
    background="{{BG_IMG_SRC}}"
    width="600"
    height="{{BG_HEIGHT}}"
    style="
      background:url('{{BG_IMG_SRC}}') center / cover no-repeat #{{FALLBACK_BG}};
      width:600px;
      height:{{BG_HEIGHT}}px;">

    <!--[if mso]>
    <v:image
      src="{{BG_IMG_SRC}}"
      style="width:450pt;height:{{BG_HEIGHT_PT}}pt;"
      fill="true" />
    <v:rect
      fill="true"
      stroke="false"
      style="width:450pt;height:{{BG_HEIGHT_PT}}pt;">
      <v:fill opacity="0%" />
      <v:textbox inset="0,0,0,0">
    <![endif]-->

    <!-- OVERLAY CONTENT -->
    <table width="100%" height="{{BG_HEIGHT}}" role="presentation">
      <tr>
        <td align="center" valign="middle" style="padding:30px;">

          <!-- HEADLINE -->
          <p style="
            margin:0 0 16px;
            font-size:26px;
            line-height:1.2;
            color:#{{INVERSE_TEXT}};
            font-weight:bold;">
            {{HEADLINE}}
          </p>

          <!-- CTA BUTTON -->
          <!--[if mso]>
          <v:roundrect
            href="{{CTA_URL}}"
            arcsize="10%"
            fillcolor="#{{ACCENT_COLOR}}"
            stroke="f"
            style="height:44px;v-text-anchor:middle;width:220px;">
            <w:anchorlock/>
            <center style="
              color:#{{CTA_TEXT_COLOR}};
              font-family:Arial,Helvetica,sans-serif;
              font-size:16px;
              font-weight:bold;">
              {{CTA_TEXT}}
            </center>
          </v:roundrect>
          <![endif]-->

          <!--[if !mso]>-->
          <a href="{{CTA_URL}}"
             style="
               background-color:#{{ACCENT_COLOR}};
               color:#{{CTA_TEXT_COLOR}};
               font-size:16px;
               font-weight:bold;
               text-decoration:none;
               padding:12px 24px;
               border-radius:6px;
               display:inline-block;">
            {{CTA_TEXT}}
          </a>
          <!--<![endif]-->

        </td>
      </tr>
    </table>

    <!--[if mso]>
      </v:textbox>
    </v:rect>
    <![endif]-->

  </td>
</tr>
