<!--
FORCED DARK MODE CTA PROTECTION RULES

USE WHEN:
- Brand CTA color must not invert
- Gmail iOS / Outlook mobile force color inversion
- CTA background or text color is altered in dark mode

RULES:
- Do NOT theme dark mode
- Only protect CTAs
-->

<style>
/* iOS Gmail + Apple Mail forced dark mode */
@media (prefers-color-scheme: dark) {
  a.cta-protected {
    background-color: #{{ACCENT_COLOR}} !important;
    color: #{{CTA_TEXT_COLOR}} !important;
  }
}

/* Outlook.com + Outlook mobile forced dark mode */
[data-ogsc] a.cta-protected {
  background-color: #{{ACCENT_COLOR}} !important;
  color: #{{CTA_TEXT_COLOR}} !important;
}

/* Gmail blend-mode protection (last resort) */
u + .body a.cta-protected {
  background-color: #{{ACCENT_COLOR}} !important;
  color: #{{CTA_TEXT_COLOR}} !important;
}
</style>
